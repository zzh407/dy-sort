<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频预览 - DY Sort</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>DY<span>Sort</span></h1>
  <nav class="nav">
    <a href="/" class="nav-link">映射</a>
    <a href="/recognize.html" class="nav-link">识别</a>
    <a href="/guide.html" class="nav-link">指引</a>
    <a href="/browse.html" class="nav-link active">浏览</a>
    <a href="/settings.html" class="nav-link">设置</a>
    <a href="/logs.html" class="nav-link">日志</a>
  </nav>
</header>

<main class="page-preview">
  <div class="pv-back"><a href="/browse.html" class="nav-link">&lsaquo; 返回</a></div>
  <div class="pv-layout">
    <aside class="pv-bloggers">
      <div class="pvb-head">
        <b id="pvb-title">博主</b><span id="pvb-count" class="pvb-count">…</span>
        <button class="btn pvb-btn" id="pvb-toggle" onclick="toggleLeftMode()"
                title="切换：博主列表 / 当前博主的其他视频">博主列表</button>
        <a class="btn pvb-btn" href="/recognize.html" title="去「图像识别」页批量标注标签">识别</a>
      </div>
      <input id="pvb-q" class="pvb-search" placeholder="搜索博主或风格，如 丝袜"
             oninput="renderBloggerList()">
      <div class="pvb-hint" id="pvb-hint"></div>
      <div id="pvb-list" class="pvb-list"></div>
    </aside>

    <div class="pv-player">
      <video id="pv-video" controls autoplay playsinline></video>
    </div>
    <aside class="pv-side">
      <h2 id="pv-name" class="pv-name"></h2>
      <div class="pv-badges" id="pv-badges"></div>
      <div class="pv-kv" id="pv-meta"></div>
      <div class="pv-kv" id="pv-path"></div>
      <div class="pv-actions">
        <button class="btn primary" id="pv-add" onclick="addBlogger()">加入 Emby</button>
        <button class="btn danger" id="pv-del-video" onclick="delThisVideo()"
                title="仅删除当前视频及其目录（海报/元数据一并删除）">删除本视频</button>
        <button class="btn danger" id="pv-del-blogger" onclick="delThisBlogger()"
                title="删除整个博主目录及其全部视频（弹窗确认，可取消）">删除该博主全部视频</button>
      </div>
      <div class="pv-nav">
        <button class="btn" id="pv-prev" onclick="step(-1)">&lsaquo; 上一个</button>
        <span id="pv-pos" class="pv-pos"></span>
        <button class="btn" id="pv-next" onclick="step(1)">下一个 &rsaquo;</button>
      </div>
    </aside>
  </div>
</main>

<div id="toast"></div>
<script src="/app.js"></script>
<script src="/preview.js"></script>
</body>
</html>
